<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Sunny Sky -->
  <rect width="400" height="400" fill="#87CEEB" />
  
  <!-- Sun -->
  <circle cx="320" cy="80" r="40" fill="#FFD700" />
  
  <!-- Sea/Horizon -->
  <rect y="250" width="400" height="150" fill="#0077be" />
  
  <!-- Beach/Sand -->
  <path d="M0 300 Q 200 280 400 300 L 400 400 L 0 400 Z" fill="#F0E68C" />
  
  <!-- Silhouette of Gateway of India (Simple) -->
  <rect x="50" y="180" width="80" height="120" fill="#555" />
  <path d="M50 180 Q 90 140 130 180 Z" fill="#555" />
  <rect x="75" y="220" width="30" height="80" fill="#333" />

  <!-- Table/Surface -->
  <rect x="200" y="320" width="150" height="10" fill="#8B4513" />
  
  <!-- Drink Glass -->
  <path d="M250 280 L 280 280 L 275 320 L 255 320 Z" fill="rgba(255, 255, 255, 0.5)" stroke="#FFF" stroke-width="2" />
  <rect x="258" y="285" width="14" height="30" fill="#FF6347" /> <!-- Tropical juice -->
  <line x1="265" y1="270" x2="265" y2="295" stroke="#333" stroke-width="2" /> <!-- Straw -->

  <!-- Stylized hand/arm -->
  <path d="M350 380 Q 300 350 275 325" fill="none" stroke="#D2B48C" stroke-width="15" stroke-linecap="round" />
</svg>