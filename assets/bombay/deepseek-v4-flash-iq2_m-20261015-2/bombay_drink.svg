<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <!-- Golden hour sky gradient -->
    <linearGradient id="skyTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a5e"/>
      <stop offset="18%" stop-color="#2a4a86"/>
      <stop offset="38%" stop-color="#c94f3d"/>
      <stop offset="55%" stop-color="#e8853a"/>
      <stop offset="72%" stop-color="#f5b94a"/>
      <stop offset="100%" stop-color="#ffe9a8"/>
    </linearGradient>

    <!-- Horizon glow -->
    <radialGradient id="sunGlow" cx="0.72" cy="0.78" r="0.5" fx="0.72" fy="0.78">
      <stop offset="0%" stop-color="#fff6c8" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#ffd879" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#f39c3d" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c94f3d" stop-opacity="0"/>
    </radialGradient>

    <!-- Sun disc -->
    <radialGradient id="sunDisc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fffde0"/>
      <stop offset="70%" stop-color="#ffef9e"/>
      <stop offset="100%" stop-color="#ffd45e"/>
    </radialGradient>

    <!-- Sea gradient -->
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b98a42"/>
      <stop offset="30%" stop-color="#d9a850"/>
      <stop offset="60%" stop-color="#7a9db8"/>
      <stop offset="100%" stop-color="#3a6a86"/>
    </linearGradient>

    <!-- Sea sun-reflection shimmer -->
    <linearGradient id="seaGlitter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd97a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd97a" stop-opacity="0"/>
    </linearGradient>

    <!-- Promenade wall gradient -->
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8b06a"/>
      <stop offset="100%" stop-color="#a8743a"/>
    </linearGradient>

    <!-- Road gradient -->
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a8a92"/>
      <stop offset="100%" stop-color="#5a5a62"/>
    </linearGradient>

    <!-- Skin tone -->
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8b58e"/>
      <stop offset="100%" stop-color="#b57a52"/>
    </linearGradient>

    <!-- Glass cocktail gradient -->
    <linearGradient id="cocktail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffcf6a" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#f59a3d" stop-opacity="0.85"/>
      <stop offset="1%" stop-color="#a84f26" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Wine glass tint -->
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a2a3d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4a1830" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Water glint highlight -->
    <radialGradient id="waterGlint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Building haze -->
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3a5a" stop-opacity="0"/>
      <stop offset="60%" stop-color="#c8a08a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d87a5a" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Long shadow filter -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="6" dy="14" stdDeviation="8" flood-color="#4a2a18" flood-opacity="0.4"/>
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <filter id="bigBlur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <clipPath id="glassOutline">
      <path d="M0 0 L20 0 L18 70 L2 70 Z"/>
    </clipPath>
  </defs>

  <!-- ==================== SKY ==================== -->
  <rect x="0" y="0" width="1400" height="900" fill="url(#skyTop)"/>

  <!-- Sun glow atmosphere -->
  <circle cx="1010" cy="600" r="620" fill="url(#sunGlow)"/>

  <!-- Wispy golden clouds -->
  <g filter="url(#bigBlur)" opacity="0.5">
    <ellipse cx="900" cy="440" rx="430" ry="30" fill="#ffe9a8"/>
    <ellipse cx="760" cy="300" rx="330" ry="24" fill="#ffd879"/>
    <ellipse cx="1150" cy="380" rx="380" ry="26" fill="#f5b94a"/>
    <ellipse cx="500" cy="260" rx="280" ry="18" fill="#e8853a"/>
  </g>

  <!-- High thin cirrus -->
  <g filter="url(#glow)" opacity="0.5">
    <path d="M150 160 Q450 120 800 140 Q1100 155 1300 130" stroke="#ffd879" stroke-width="5" fill="none"/>
    <path d="M90 210 Q500 175 950 190 Q1250 200 1360 185" stroke="#ffe9a8" stroke-width="3" fill="none"/>
  </g>

  <!-- Sun -->
  <circle cx="1010" cy="600" r="65" fill="url(#sunDisc)"/>
  <circle cx="1010" cy="600" r="90" fill="#fff6c8" opacity="0.35" filter="url(#glow)"/>

  <!-- ==================== SEA ==================== -->
  <rect x="0" y="640" width="1400" height="160" fill="url(#sea)"/>

  <!-- Sun path / glitter on water -->
  <g>
    <ellipse cx="1010" cy="700" rx="220" ry="45" fill="url(#seaGlitter)" opacity="0.6"/>
    <ellipse cx="1010" cy="730" rx="170" ry="30" fill="#ffd97a" opacity="0.5"/>
    <ellipse cx="1010" cy="760" rx="130" ry="22" fill="#ffcf6a" opacity="0.45"/>
    <ellipse cx="1010" cy="672" rx="240" ry="12" fill="#fff6c8" opacity="0.4"/>
  </g>

  <!-- Scattered wave glints -->
  <g opacity="0.5" filter="url(#glow)">
    <ellipse cx="760" cy="690" rx="18" ry="3" fill="#ffd97a"/>
    <ellipse cx="1180" cy="712" rx="14" ry="2.5" fill="#ffd97a"/>
    <ellipse cx="840" cy="745" rx="22" ry="3.5" fill="#f5b94a"/>
    <ellipse cx="900" cy="668" rx="16" ry="2.5" fill="#fff6c8"/>
    <ellipse cx="1120" cy="690" rx="20" ry="3" fill="#f5b94a"/>
    <ellipse cx="1040" cy="775" rx="12" ry="2" fill="#ffcf6a"/>
  </g>

  <!-- Horizon line glow -->
  <line x1="0" y1="640" x2="1400" y2="640" stroke="#ffd97a" stroke-width="2" opacity="0.8"/>

  <!-- ==================== DISTANT ART-DECO SKYLINE ==================== -->
  <g filter="url(#haze)" opacity="0.85">
    <!-- distant silhouettes -->
    <path d="M60 640 L60 590 L95 590 L95 560 L110 560 L110 640 Z" fill="#3a2a4a"/>
    <path d="M130 640 L130 585 L175 585 L175 555 L195 555 L195 640 Z" fill="#3a2a50"/>
    <path d="M215 640 L215 575 L240 575 L240 540 L260 540 L260 590 L290 590 L290 640 Z" fill="#3a2a44"/>
    <path d="M320 640 L320 560 L340 560 L340 600 L380 600 L380 640 Z" fill="#4a2a4a"/>
    <path d="M1180 640 L1180 570 L1210 570 L1210 545 L1235 545 L1235 640 Z" fill="#3a2a50"/>
    <path d="M1250 640 L1250 590 L1290 590 L1290 555 L1305 555 L1305 640 Z" fill="#2a2a48"/>
    <path d="M1320 640 L1320 575 L1355 575 L1355 640 Z" fill="#3a2a44"/>
  </g>

  <!-- ==================== PROMENADE / MARINE DRIVE WALL ==================== -->
  <rect x="0" y="700" width="1400" height="200" fill="url(#wall)"/>
  <!-- wall top edge lit by sun -->
  <line x1="0" y1="700" x2="1400" y2="700" stroke="#ffe9a8" stroke-width="3" opacity="0.6"/>
  <line x1="0" y1="702" x2="1400" y2="702" stroke="#ffffff" stroke-width="1" opacity="0.25"/>

  <!-- lamp posts along wall (Queen's Necklace pearls) -->
  <g>
    <g fill="#6a6a72">
      <rect x="150" y="660" width="8" height="40" rx="2"/>
      <rect x="640" y="660" width="8" height="40" rx="2"/>
      <rect x="1130" y="660" width="8" height="40" rx="2"/>
    </g>
    <g opacity="0.95">
      <circle cx="154" cy="654" r="7" fill="#ffef9e"/>
      <circle cx="644" cy="654" r="7" fill="#ffef9e"/>
      <circle cx="1134" cy="654" r="7" fill="#ffef9e"/>
      <circle cx="154" cy="654" r="14" fill="#ffd879" opacity="0.35" filter="url(#glow)"/>
      <circle cx="644" cy="654" r="14" fill="#ffd879" opacity="0.35" filter="url(#glow)"/>
      <circle cx="1134" cy="654" r="14" fill="#ffd879" opacity="0.35" filter="url(#glow)"/>
    </g>
  </g>

  <!-- ==================== GATEWAY OF INDIA (distant landmark) ==================== -->
  <g opacity="0.9">
    <path d="M620 640 L620 600 L700 600 L700 640 Z" fill="#e6c9a0"/>
    <path d="M660 520 L660 600 L680 600 L680 520 Z" fill="#e6c9a0"/>
    <rect x="622" y="596" width="76" height="8" fill="#cfa878"/>
    <path d="M640 560 L660 505 L680 560 Z" fill="#ffe9a8" opacity="0.85"/>
    <rect x="624" y="590" width="72" height="4" fill="#cfa878"/>
  </g>

  <!-- ==================== BACKGROUND: CAFE TABLE + CHAIRS ==================== -->
  <g filter="url(#softShadow)">
    <!-- parasol -->
    <path d="M820 520 A 90 90 0 0 1 1000 520 Z" fill="#e8853a" opacity="0.9"/>
    <path d="M850 520 A 90 90 0 0 1 1000 520 Z" fill="#a44a2a" opacity="0.85"/>
    <path d="M820 520 A 90 90 0 0 1 970 520 Z" fill="#f5b94a" opacity="0.5"/>
    <path d="M910 520 L910 610" stroke="#5a3a2a" stroke-width="5"/>
    <circle cx="910" cy="518" r="6" fill="#5a3a2a"/>

    <!-- table -->
    <ellipse cx="910" cy="700" rx="95" ry="16" fill="#6a4026"/>
    <ellipse cx="910" cy="696" rx="95" ry="16" fill="#8a5a36"/>
    <rect x="890" y="696" width="40" height="70" fill="#5a4026"/>
    <ellipse cx="910" cy="766" rx="52" ry="10" fill="#3a2a1a"/>
  </g>

  <!-- ==================== FOREGROUND PEOPLE ==================== -->
  <!-- Main subject: relaxed man leaning/turned with cocktail, seated -->
  <g>
    <!-- chair -->
    <g fill="#a8743a">
      <rect x="520" y="760" width="130" height="8" rx="3"/>
      <rect x="600" y="640" width="8" height="128"/>
      <rect x="570" y="640" width="8" height="128"/>
      <path d="M600 640 L690 620 L700 640 L600 650 Z" fill="#b5843f"/>
      <path d="M570 640 L500 615 L490 635 L570 650 Z" fill="#b5843f"/>
      <rect x="500" y="615" width="8" height="20" rx="3"/>
      <rect x="690" y="618" width="8" height="22" rx="3"/>
      <rect x="500" y="748" width="8" height="22" rx="3"/>
      <rect x="690" y="746" width="8" height="22" rx="3"/>
      <line x1="500" y1="615" x2="640" y2="760" stroke="#a8743a" stroke-width="6"/>
    </g>

    <!-- man body -->
    <g>
      <!-- torso (turned slightly) -->
      <path d="M560 660 Q590 645 630 660 L635 760 L557 760 Z" fill="#3a5a7a"/>
      <!-- shirt collar / sleeve -->
      <path d="M560 660 L590 652 L620 660 L590 675 Z" fill="#ffffff"/>
      <!-- arm raised holding cocktail -->
      <g>
        <path d="M600 665 Q630 648 652 640 L658 652 Q632 660 604 676 Z" fill="url(#skin)"/>
        <ellipse cx="652" cy="630" rx="16" ry="14" fill="url(#skin)"/>
      </g>
      <!-- head -->
      <circle cx="592" cy="606" r="34" fill="url(#skin)"/>
      <!-- hair -->
      <path d="M556 600 Q562 560 592 562 Q628 560 624 596 Q622 580 610 576 Q590 572 574 578 Q562 584 556 600 Z" fill="#2a2a2e"/>
      <!-- facial shadow -->
      <path d="M576 596 Q588 612 606 606" stroke="#9a6a4a" stroke-width="4" fill="none" opacity="0.3"/>
    </g>

    <!-- COCKTAIL GLASS (held) -->
    <g>
      <path d="M652 626 L648 572 L656 572 L660 626 Z" fill="#ffffff" opacity="0.35"/>
      <path d="M650 626 A 6 6 0 0 1 638 618 L638 610 L661 610 L661 618 A 6 6 0 0 1 650 626 Z" fill="url(#cocktail)"/>
      <!-- orange slice garnish -->
      <circle cx="649" cy="612" r="9" fill="#ffa03d" opacity="0.9"/>
      <circle cx="649" cy="612" r="6" fill="#ffcf6a" opacity="0.9"/>
      <circle cx="649" cy="612" r="2.5" fill="#ffef9e"/>
      <!-- straw -->
      <line x1="656" y1="600" x2="668" y2="566" stroke="#e8653a" stroke-width="3"/>
      <!-- glass highlight -->
      <path d="M652 578 L652 622" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    </g>

    <!-- second person: companion woman leaning across toward him -->
    <g>
      <path d="M980 662 Q965 656 950 668 L952 760 L1008 760 Q1000 668 980 662 Z" fill="#6a3a5a"/>
      <path d="M985 665 Q1000 652 1012 644 L1018 656 Q1002 664 988 676 Z" fill="url(#skin)"/>
      <ellipse cx="1016" cy="636" rx="15" ry="13" fill="url(#skin)"/>
      <circle cx="1002" cy="612" r="30" fill="url(#skin)"/>
      <!-- hair long dark -->
      <path d="M972 604 Q972 572 1002 572 Q1032 572 1032 604 Q1030 586 1018 578 Q1002 570 986 578 Q974 586 972 604 Z" fill="#1a1a1e"/>
      <path d="M1000 596 Q998 620 1004 640 L1008 640 Q1002 620 1004 596 Z" fill="#1a1a1e"/>
    </g>

    <!-- wine glass she holds toward toast -->
    <g>
      <path d="M1014 630 L1010 588 A 4 4 0 0 1 1024 588 L1018 628 Z" fill="url(#wine)"/>
      <line x1="1020" y1="586" x2="1020" y2="632" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
      <line x1="1008" y1="632" x2="1024" y2="632" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
    </g>
  </g>

  <!-- ==================== TABLE IN FOREGROUND with bottles & glasses ==================== -->
  <!-- front table -->
  <g filter="url(#softShadow)">
    <ellipse cx="840" cy="795" rx="150" ry="15" fill="#7a4e2c"/>
    <ellipse cx="840" cy="790" rx="150" ry="15" fill="#9a623a"/>

    <!-- bottle -->
    <rect x="900" y="700" width="22" height="55" rx="6" fill="#1a2a18"/>
    <rect x="904" y="700" width="14" height="26" rx="4" fill="#8a3a2a"/>
    <path d="M905 720 L922 720 L920 726 L907 726 Z" fill="#c8a070"/>
    <!-- beer glass -->
    <path d="M940 700 L940 660 A 8 8 0 0 1 956 660 L956 700 Z" fill="#ffcf6a" opacity="0.6"/>
    <line x1="943" y1="668" x2="953" y2="668" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    <!-- small shot glasses + peanuts bowl -->
    <ellipse cx="780" cy="778" rx="26" ry="8" fill="#d8b088"/>
    <circle cx="805" cy="772" r="6" fill="#ffd879" opacity="0.4"/>  <!-- peanut -->
    <circle cx="768" cy="774" r="6" fill="#c8944a"/>  <!-- peanut -->
  </g>

  <!-- ==================== TAXI SILHOUETTE BEHIND ==================== -->
  <g opacity="0.5" filter="url(#glow)" transform="translate(60,0)">
    <path d="M200 700 Q200 688 212 684 L244 684 L252 668 L300 668 L308 684 L336 684 Q348 688 348 700 Z" fill="#1a1a1e"/>
    <path d="M214 686 L258 686 L264 700 L212 700 Z" fill="#d8c22a"/>
    <circle cx="228" cy="700" r="10" fill="#0a0a0e"/>
    <circle cx="318" cy="700" r="10" fill="#0a0a0e"/>
    <rect x="224" y="716" width="8" height="10" fill="#2a2a2e"/>
    <rect x="314" y="716" width="8" height="10" fill="#2a2a2e"/>
  </g>

  <!-- second taxi far right -->
  <g opacity="0.45" filter="url(#glow)" transform="translate(1050,20) scale(0.85)">
    <path d="M200 700 Q200 688 212 684 L244 684 L252 668 L300 668 L308 684 L336 684 Q348 688 348 700 Z" fill="#1a1a1e"/>
    <path d="M214 686 L258 686 L264 700 L212 700 Z" fill="#c8b22a"/>
    <circle cx="228" cy="700" r="10" fill="#0a0a0e"/>
    <circle cx="318" cy="700" r="10" fill="#0a0a0e"/>
  </g>

  <!-- ==================== GULLS ==================== -->
  <g stroke="#2a2a2e" stroke-width="2" fill="none" opacity="0.7">
    <path d="M520 260 Q530 250 540 260 Q530 256 520 262 L530 258"/>
    <path d="M700 200 Q708 192 716 200 Q708 196 700 202 L708 198"/>
    <path d="M820 300 Q827 293 834 300 Q827 296 820 302 L827 298"/>
  </g>

  <!-- ==================== VIGNETTE / AMBIANCE ==================== -->
  <radialGradient id="vig" cx="0.5" cy="0.45" r="0.75">
    <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#1a0a08" stop-opacity="0.55"/>
  </radialGradient>
  <rect x="0" y="0" width="1400" height="900" fill="url(#vig)"/>

  <!-- warm cast light across the whole scene -->
  <linearGradient id="warmcast" x1="1" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffb03d" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#ffb03d" stop-opacity="0"/>
  </linearGradient>
  <rect x="0" y="0" width="1400" height="900" fill="url(#warmcast)"/>
</svg>
