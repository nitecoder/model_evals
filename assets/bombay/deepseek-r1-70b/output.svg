<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <title>Evening Drink in Bombay</title>
  
  <!-- Sky Background with Golden Hour Effect -->
  <defs>
    <radialGradient id="goldenHour" cx="400" cy="300" r="400" fx="400" fy="300">
      <stop offset="0%" style="stop-color:#FFE64D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC44D;stop-opacity:1" />
    </radialGradient>
    
    <!-- Water Reflection Filter -->
    <filter id="waterReflection">
      <feGaussianBlur stdDeviation="2" result="gauss"/>
      <feOffset dx="2" dy="2" result="offset"/>
      <feMerge>
        <feMergeNode in="gauss"/>
        <feMergeNode in="offset"/>
      </feMerge>
    </filter>
    
    <!-- Ambient Light Filter -->
    <filter id="ambientLight">
      <feDiffuseLighting lighting-color="#F5DEB3" surface-scale="1">
        <feDistantLight azimuth="45" elevation="30" />
      </feDiffuseLighting>
    </filter>
  </defs>

  <!-- Background Elements -->
  <rect width="800" height="600" fill="url(#goldenHour)" />
  
  <!-- Mumbai Skyline Silhouette -->
  <path d="M0 400 L100 500 L200 370 L300 520 L400 350 L500 510 L600 300 L700 450 L800 300 L800 600 L0 600" 
        fill="#2F343A" />
  
  <!-- Water Surface -->
  <path d="M0 500 Q400 470 800 500 Q600 520 200 520 L0 500" 
        fill="#95E1D8" filter="url(#waterReflection)" />
  
  <!-- Main Figures -->
  <g transform="translate(300 400)">
    <!-- Person -->
    <path d="M0 0 L50 -40 L100 0 L95 120 L65 150 L45 180 L25 160 L5 140 L0 100" 
          fill="#F0C4E0" filter="url(#ambientLight)" />
    <!-- Drink Glass -->
    <path d="M20 60 L40 60 L35 40 L25 40 L20 60" fill="#FF5733" />
    <!-- Straw -->
    <rect x="25" y="40" width="2" height="20" fill="#FFC166" />
    <!-- Cocktail -->
    <path d="M25 20 Q30 25 25 30" fill="#FFA07A" />
  </g>
  
  <!-- Foreground Elements -->
  <path d="M700 300 Q650 250 600 260 L600 350 L650 300 L700 350" 
        fill="#2F343A" />
  
  <!-- Palm Tree -->
  <path d="M60 200 L40 220 L20 180 L0 200 L20 160 L40 140 L60 120 L80 140 L100 160 L80 180 L60 200" 
        fill="#2E7D32" />
  
  <!-- Ambient Lighting -->
  <rect width="800" height="600" fill="rgba(245,222,179,0.2)" />
</svg>