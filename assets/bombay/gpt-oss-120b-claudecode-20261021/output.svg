<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="800" height="600" viewBox="0 0 800 600">
  <!-- Definitions for gradients and filters -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffae6c"/>
      <stop offset="100%" stop-color="#c96bff"/>
    </linearGradient>
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="seaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0c1b44"/>
    </linearGradient>
    <radialGradient id="glassGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </radialGradient>
    <filter id="sunGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glassReflection" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur" mode="screen"/>
    </filter>
    <filter id="ambientGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feFlood flood-color="#ffb347" result="color"/>
      <feComposite in="color" in2="SourceAlpha" operator="in" result="coloredAlpha"/>
      <feGaussianBlur in="coloredAlpha" stdDeviation="30" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="800" height="600" fill="url(#skyGradient)" />
  <!-- Sun (golden hour) -->
  <circle cx="600" cy="250" r="80" fill="url(#sunGradient)" filter="url(#sunGlow)" />
  <!-- Sea -->
  <rect y="400" width="800" height="200" fill="url(#seaGradient)" />
  <!-- Ambient golden glow over water -->
  <rect y="400" width="800" height="200" fill="none" filter="url(#ambientGlow)" />

  <!-- City silhouette (stylized Mumbai skyline) -->
  <g fill="#2b2b2b" stroke="none">
    <rect x="0" y="350" width="120" height="50" />
    <rect x="130" y="320" width="80" height="80" />
    <rect x="220" y="340" width="100" height="60" />
    <rect x="330" y="300" width="70" height="100" />
    <rect x="410" y="340" width="90" height="60" />
    <rect x="510" y="320" width="80" height="80" />
    <rect x="600" y="340" width="70" height="60" />
    <rect x="690" y="350" width="110" height="50" />
  </g>

  <!-- Gateway of India (simplified) -->
  <g fill="#2b2b2b">
    <rect x="340" y="280" width="120" height="70" />
    <rect x="360" y="260" width="20" height="20" />
    <rect x="380" y="260" width="20" height="20" />
    <rect x="400" y="260" width="20" height="20" />
    <rect x="420" y="260" width="20" height="20" />
    <rect x="440" y="260" width="20" height="20" />
  </g>

  <!-- Palm tree on the left side -->
  <g transform="translate(100,350)" fill="#2b2b2b">
    <rect x="5" y="-80" width="10" height="80" />
    <path d="M10 -80 C -30 -130, -30 -150, 10 -150 C 50 -130, 50 -110, 10 -80" fill="#2b2b2b" />
  </g>

  <!-- Table (wooden) -->
  <rect x="540" y="380" width="180" height="20" fill="#8b5a2b" filter="url(#ambientGlow)" />

  <!-- Person 1 (enjoying a drink) -->
  <g id="person1" transform="translate(600,300)">
    <!-- Head -->
    <ellipse cx="0" cy="-30" rx="12" ry="15" fill="#fcd5b4" />
    <!-- Torso -->
    <rect x="-8" y="-15" width="16" height="30" fill="#1c4e80" />
    <!-- Arms -->
    <line x1="-8" y1="-5" x2="-30" y2="-10" stroke="#fcd5b4" stroke-width="4" />
    <line x1="8" y1="-5" x2="30" y2="-10" stroke="#fcd5b4" stroke-width="4" />
    <!-- Glass (wine/whisky) -->
    <path d="M30 -10 C32 -12, 32 -18, 30 -20 L28 -20 C26 -18, 26 -12, 28 -10 Z" fill="url(#glassGradient)" stroke="#aaa" stroke-width="1" filter="url(#glassReflection)" />
  </g>

  <!-- Person 2 (companion) -->
  <g id="person2" transform="translate(560,300)">
    <ellipse cx="0" cy="-30" rx="12" ry="15" fill="#fcd5b4" />
    <rect x="-8" y="-15" width="16" height="30" fill="#1c4e80" />
    <line x1="-8" y1="-5" x2="-30" y2="-10" stroke="#fcd5b4" stroke-width="4" />
    <line x1="8" y1="-5" x2="30" y2="-10" stroke="#fcd5b4" stroke-width="4" />
    <path d="M30 -10 C32 -12, 32 -18, 30 -20 L28 -20 C26 -18, 26 -12, 28 -10 Z" fill="url(#glassGradient)" stroke="#aaa" stroke-width="1" filter="url(#glassReflection)" />
  </g>

  <!-- Subtle water reflection -->
  <ellipse cx="400" cy="520" rx="300" ry="30" fill="rgba(255,255,255,0.1)" />

  <!-- Optional: faint text indicating location (not necessary) -->
</svg>
