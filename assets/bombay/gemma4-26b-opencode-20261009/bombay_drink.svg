<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff7e5f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#feb47b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffcc33;stop-opacity:1" />
    </linearGradient>
    
    <!-- Sea Gradient -->
    <linearGradient id="seaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3c72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a5298;stop-opacity:1" />
    </linearGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff7e6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c00;stop-opacity:0" />
    </radialGradient>

    <!-- Drink Gradient (Amber liquid) -->
    <linearGradient id="drinkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffcc33;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>

    <!-- Table/Surface Glow -->
    <linearGradient id="tableGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3d2b1f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0f0a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Sky -->
  <rect width="800" height="600" fill="url(#skyGradient)" />
  
  <!-- Sun -->
  <circle cx="400" cy="350" r="80" fill="url(#sunGlow)" />
  <circle cx="400" cy="350" r="40" fill="#ffec8b" />

  <!-- Sea -->
  <rect x="0" y="400" width="800" height="200" fill="url(#seaGradient)" />
  
  <!-- Distant Bombay Skyline Silhouette (Gateway/Taj Silhouette) -->
  <path d="M0 400 L0 380 L50 380 L50 350 L80 350 L80 380 L150 380 L150 330 L200 330 L200 380 L250 380 L250 360 L300 360 L300 380 L400 380 L400 340 L450 340 L450 380 L500 380 L500 350 L550 350 L550 380 L600 380 L600 340 L650 340 L650 380 L700 380 L700 360 L750 360 L750 380 L800 380 L800 400 Z" fill="#1a1a1a" opacity="0.8" />
  
  <!-- Marine Drive Curve (Stylized) -->
  <path d="M0 400 Q 400 350 800 400" stroke="#2c3e50" stroke-width="10" fill="none" opacity="0.5" />

  <!-- Foreground: Table -->
  <rect x="0" y="500" width="800" height="100" fill="url(#tableGlow)" />
  <rect x="0" y="500" width="800" height="5" fill="#5d4037" opacity="0.5" />

  <!-- Foreground: The Drink (Glass) -->
  <g transform="translate(450, 420)">
    <!-- Glass Shadow -->
    <ellipse cx="40" cy="110" rx="35" ry="5" fill="rgba(0,0,0,0.4)" />
    
    <!-- Glass Body -->
    <path d="M20 10 L60 10 L55 100 L25 100 Z" fill="rgba(255, 255, 255, 0.2)" stroke="rgba(255, 255, 255, 0.5)" stroke-width="1" />
    
    <!-- Liquid -->
    <path d="M23 30 L57 30 L55 100 L25 100 Z" fill="url(#drinkGradient)" />
    
    <!-- Ice Cubes -->
    <rect x="30" y="40" width="20" height="20" fill="rgba(255, 255, 255, 0.4)" transform="rotate(15 40 50)" />
    <rect x="35" y="60" width="15" height="15" fill="rgba(255, 255, 255, 0.3)" transform="rotate(-10 42 67)" />
    
    <!-- Highlights on Liquid/Glass -->
    <path d="M25 35 L30 35" stroke="white" stroke-width="1" opacity="0.6" />
    <path d="M50 40 L52 80" stroke="white" stroke-width="2" opacity="0.3" />
  </g>

  <!-- Foreground: Person's Arm (Silhouette/Warm tone) -->
  <path d="M800 600 L600 600 L550 450 Q 520 400 490 420 L480 450 Q 500 500 550 550 L800 600" fill="#3e2723" opacity="0.9" />
  
  <!-- Golden Light Glint on Table -->
  <ellipse cx="450" cy="510" rx="60" ry="10" fill="#ffcc33" opacity="0.2" />
  <circle cx="450" cy="510" r="5" fill="#ffffff" opacity="0.4" />

</svg>