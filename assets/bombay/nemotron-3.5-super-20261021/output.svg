<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <title>Relaxing drink in Bombay, golden hour</title>
  <desc>Two people enjoying drinks on a Marine Drive terrace at golden hour, with the Gateway of India silhouette in the background.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1426"/>
      <stop offset="28%" stop-color="#422718"/>
      <stop offset="58%" stop-color="#964a24"/>
      <stop offset="78%" stop-color="#f5924c"/>
      <stop offset="90%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ffe0a6"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffedd2"/>
      <stop offset="30%" stop-color="#ffc478"/>
      <stop offset="75%" stop-color="#ff8a33"/>
      <stop offset="100%" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#341e2a"/>
      <stop offset="100%" stop-color="#180c12"/>
    </linearGradient>

    <linearGradient id="drink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9c4a08"/>
      <stop offset="45%" stop-color="#c96f10"/>
      <stop offset="100%" stop-color="#f5b308"/>
    </linearGradient>

    <linearGradient id="drinkHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24171c"/>
      <stop offset="100%" stop-color="#140c10"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="blurSoft">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="800" fill="url(#sky)"/>

  <!-- Golden hour sun -->
  <circle cx="1000" cy="500" r="44" fill="#ffb74d" filter="url(#glow)"/>
  <circle cx="1000" cy="500" r="120" fill="url(#sunGlow)" opacity="0.55"/>

  <!-- Soft clouds -->
  <ellipse cx="220" cy="320" rx="105" ry="38" fill="#ffffff" opacity="0.22"/>
  <ellipse cx="380" cy="345" rx="85" ry="32" fill="#ffffff" opacity="0.18"/>
  <ellipse cx="680" cy="290" rx="95" ry="30" fill="#ffffff" opacity="0.22"/>

  <!-- Bokeh -->
  <circle cx="140" cy="260" r="28" fill="#ffb74d" opacity="0.12"/>
  <circle cx="1050" cy="320" r="34" fill="#ff8c32" opacity="0.10"/>
  <circle cx="400" cy="420" r="22" fill="#f59e0b" opacity="0.12"/>

  <!-- Gateway of India silhouette (right background) -->
  <g fill="#151013">
    <path d="M770,520 L720,520 L720,290 L690,290 L690,240 Q810,140 930,240 L960,290 L930,290 L930,520 Z"/>
    <path d="M750,520 L750,260 Q790,200 850,260 L830,270 Q790,280 750,270 Z"/>
    <path d="M890,520 L890,260 Q850,200 790,260 L810,270 Q850,280 890,270 Z"/>
    <rect x="795" y="244" width="60" height="16" rx="4"/>
    <rect x="805" y="260" width="40" height="7" rx="2"/>
  </g>

  <!-- Marine Drive skyline silhouette (left background) -->
  <g fill="#151013">
    <path d="M40,520 L40,455 L75,455 L75,495 L115,495 L115,450 L150,450 L150,485 L185,485 L185,460 L225,460 L225,500 L265,500 L265,455 L305,455 L305,520 Z"/>
    <path d="M320,520 L320,430 L360,430 L360,475 L400,475 L400,440 L440,440 L440,520 Z"/>
  </g>

  <!-- Sea -->
  <rect x="0" y="520" width="1200" height="80" fill="url(#sea)"/>
  <path d="M0,520 Q250,560 620,520 T1200,520" fill="none" stroke="#ffd166" stroke-width="2.5" opacity="0.50"/>
  <path d="M0,535 Q350,580 780,535" fill="none" stroke="#ffb74d" stroke-width="2" opacity="0.42"/>
  <path d="M880,520 Q960,555 1040,520" fill="none" stroke="#ffd166" stroke-width="3.5" opacity="0.65"/>

  <!-- Terrace floor -->
  <rect x="0" y="640" width="1200" height="160" fill="url(#floorGrad)"/>

  <!-- Railing -->
  <line x1="0" y1="640" x2="1200" y2="640" stroke="#3d2a2f" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#5d464d" stroke-width="4" stroke-linecap="round">
    <line x1="60" y1="640" x2="60" y2="700"/>
    <line x1="210" y1="640" x2="210" y2="700"/>
    <line x1="370" y1="640" x2="370" y2="700"/>
    <line x1="530" y1="640" x2="530" y2="700"/>
    <line x1="690" y1="640" x2="690" y2="700"/>
    <line x1="850" y1="640" x2="850" y2="700"/>
    <line x1="1010" y1="640" x2="1010" y2="700"/>
    <line x1="1150" y1="640" x2="1150" y2="700"/>
  </g>

  <!-- Marine Drive sign -->
  <rect x="495" y="616" width="150" height="20" rx="4" fill="#24181c"/>
  <text x="570" y="631" font-family="sans-serif" font-size="12" fill="#ffd166" text-anchor="middle" font-weight="bold" letter-spacing="1">Marine Drive</text>

  <!-- Warm golden-hour wash over terrace -->
  <rect x="0" y="600" width="1200" height="200" fill="#ff8c32" opacity="0.18"/>

  <!-- PEOPLE (seated behind the table; the tabletop occludes their lower bodies) -->
  <!-- Person A (left, cream kurta) -->
  <g>
    <rect x="434" y="700" width="16" height="80" fill="#d9c7b3"/>
    <rect x="454" y="700" width="16" height="80" fill="#d9c7b3"/>
    <ellipse cx="455" cy="682" rx="26" ry="26" fill="#f0e6d8"/>
    <line x1="430" y1="670" x2="480" y2="672" stroke="#f0e6d8" stroke-width="6" stroke-linecap="round"/>
    <line x1="468" y1="662" x2="515" y2="692" stroke="#f0e6d8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="455" cy="643" r="19" fill="#e0ac69"/>
    <ellipse cx="455" cy="636" rx="20" ry="15" fill="#24140c"/>
    <path d="M442,640 Q445,648 450,646" stroke="#8a5a3a" stroke-width="2" fill="none"/>
    <path d="M462,642 Q468,646 472,640" stroke="#8a5a3a" stroke-width="2" fill="none"/>
    <path d="M448,652 Q455,658 462,654" stroke="#b76e4a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Person B (right, teal shirt) -->
  <g>
    <rect x="770" y="698" width="16" height="82" fill="#9ab3b8"/>
    <rect x="790" y="698" width="16" height="82" fill="#9ab3b8"/>
    <ellipse cx="790" cy="678" rx="24" ry="24" fill="#1f6f7e"/>
    <line x1="764" y1="666" x2="816" y2="668" stroke="#1f6f7e" stroke-width="6" stroke-linecap="round"/>
    <line x1="802" y1="658" x2="720" y2="698" stroke="#1f6f7e" stroke-width="6" stroke-linecap="round"/>
    <circle cx="790" cy="639" r="19" fill="#e0ac69"/>
    <ellipse cx="790" cy="632" rx="20" ry="15" fill="#162428"/>
    <path d="M777,636 Q780,644 785,642" stroke="#8a5a3a" stroke-width="2" fill="none"/>
    <path d="M797,638 Q803,642 807,636" stroke="#8a5a3a" stroke-width="2" fill="none"/>
    <path d="M783,648 Q790,654 797,650" stroke="#b76e4a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- TABLE -->
  <ellipse cx="630" cy="706" rx="105" ry="32" fill="#2d1b20"/>
  <rect x="595" y="714" width="70" height="66" rx="3" fill="#3d2a2f"/>

  <!-- DRINK A (whiskey-style, amber, on the rocks with lime) -->
  <g>
    <ellipse cx="525" cy="690" rx="22" ry="7" fill="#c9b8a6"/>
    <path d="M503,697 L500,738 L550,738 L547,697 Z" fill="url(#drink)"/>
    <ellipse cx="525" cy="697" rx="19" ry="5" fill="#f5b308" opacity="0.55"/>
    <rect x="508" y="702" width="9" height="7" rx="2" fill="#ffffff" opacity="0.85"/>
    <rect x="535" y="704" width="7" height="6" rx="2" fill="#ffffff" opacity="0.75"/>
    <rect x="512" y="714" width="8" height="6" rx="2" fill="#ffffff" opacity="0.90"/>
    <path d="M511,708 L523,708 L517,716 Z" fill="#6aa04c"/>
    <ellipse cx="525" cy="686" rx="22" ry="7" fill="none" stroke="#b8a896" stroke-width="2"/>
    <ellipse cx="512" cy="694" rx="5" ry="13" fill="url(#drinkHighlight)" opacity="0.6"/>
  </g>

  <!-- DRINK B -->
  <g>
    <ellipse cx="705" cy="688" rx="22" ry="7" fill="#c9b8a6"/>
    <path d="M683,695 L680,736 L730,736 L727,695 Z" fill="url(#drink)"/>
    <ellipse cx="705" cy="695" rx="19" ry="5" fill="#f5b308" opacity="0.55"/>
    <rect x="688" y="700" width="9" height="7" rx="2" fill="#ffffff" opacity="0.85"/>
    <rect x="715" y="702" width="7" height="6" rx="2" fill="#ffffff" opacity="0.75"/>
    <rect x="692" y="712" width="8" height="6" rx="2" fill="#ffffff" opacity="0.90"/>
    <path d="M691,706 L703,706 L697,714 Z" fill="#6aa04c"/>
    <ellipse cx="705" cy="684" rx="22" ry="7" fill="none" stroke="#b8a896" stroke-width="2"/>
    <ellipse cx="692" cy="692" rx="5" ry="13" fill="url(#drinkHighlight)" opacity="0.6"/>
  </g>

  <!-- Hands on glasses -->
  <path d="M468,662 Q498,690 520,702" stroke="#f0e6d8" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M802,658 Q760,682 718,696" stroke="#1f6f7e" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- PLANT (left foreground) -->
  <g>
    <ellipse cx="150" cy="768" rx="28" ry="16" fill="#35242a"/>
    <line x1="130" y1="768" x2="170" y2="768" stroke="#4a3436" stroke-width="3"/>
    <ellipse cx="132" cy="740" rx="14" ry="22" fill="#5aa85a" transform="rotate(-20 132 740)"/>
    <ellipse cx="150" cy="725" rx="18" ry="26" fill="#6bb86b" transform="rotate(-10 150 725)"/>
    <ellipse cx="172" cy="745" rx="14" ry="20" fill="#5aa85a" transform="rotate(10 172 745)"/>
    <ellipse cx="150" cy="760" rx="16" ry="12" fill="#7cc87c"/>
  </g>

  <!-- STRING LIGHTS -->
  <path d="M100,180 Q550,130 1100,170" fill="none" stroke="#46342c" stroke-width="3"/>
  <g>
    <circle cx="160" cy="190" r="6" fill="#fde047" filter="url(#glow)"/>
    <circle cx="160" cy="190" r="22" fill="url(#bulbGlow)" opacity="0.55"/>
    <circle cx="340" cy="160" r="6" fill="#fde047" filter="url(#glow)"/>
    <circle cx="340" cy="160" r="22" fill="url(#bulbGlow)" opacity="0.55"/>
    <circle cx="540" cy="145" r="6" fill="#fde047" filter="url(#glow)"/>
    <circle cx="540" cy="145" r="22" fill="url(#bulbGlow)" opacity="0.55"/>
    <circle cx="720" cy="148" r="6" fill="#fde047" filter="url(#glow)"/>
    <circle cx="720" cy="148" r="22" fill="url(#bulbGlow)" opacity="0.55"/>
    <circle cx="900" cy="162" r="6" fill="#fde047" filter="url(#glow)"/>
    <circle cx="900" cy="162" r="22" fill="url(#bulbGlow)" opacity="0.55"/>
    <circle cx="1060" cy="178" r="6" fill="#fde047" filter="url(#glow)"/>
    <circle cx="1060" cy="178" r="22" fill="url(#bulbGlow)" opacity="0.55"/>
  </g>
  <g stroke="#c9a868" stroke-width="1.5" opacity="0.8">
    <line x1="160" y1="190" x2="155" y2="202"/>
    <line x1="340" y1="160" x2="332" y2="174"/>
    <line x1="540" y1="145" x2="530" y2="160"/>
    <line x1="720" y1="148" x2="712" y2="164"/>
    <line x1="900" y1="162" x2="890" y2="178"/>
    <line x1="1060" y1="178" x2="1050" y2="194"/>
  </g>

  <!-- Soft light spill from bulbs onto the pair -->
  <circle cx="455" cy="643" r="42" fill="#ffd166" opacity="0.05" filter="url(#blurSoft)"/>
  <circle cx="790" cy="639" r="42" fill="#ffd166" opacity="0.05" filter="url(#blurSoft)"/>

  <!-- Foreground vignette -->
  <rect x="0" y="720" width="1200" height="80" fill="#2d1b1e" opacity="0.35"/>
</svg>
