<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky -->
  <rect width="400" height="400" fill="#87CEEB" />
  <circle cx="320" cy="60" r="35" fill="#FFD700" />
  
  <!-- Sea -->
  <rect y="280" width="400" height="120" fill="#0077be" />
  
  <!-- Gateway of India (Iconic Arch) -->
  <g transform="translate(100, 80)" fill="#444">
    <rect x="0" y="80" width="160" height="160" /> <!-- Main block -->
    <path d="M30 240 L30 60 Q80 0 130 60 L130 240 Z" /> <!-- The Arch structure -->
    <path d="M50 240 L50 100 Q80 60 110 100 L110 240 Z" fill="#222" /> <!-- The actual hole/arch way -->
    <rect x="0" y="0" width="160" height="30" /> <!-- Top cap -->
    <circle cx="80" cy="0" r="20" /> <!-- Dome bit -->
  </g>

  <!-- Foreground: Table and Person -->
  <!-- Table -->
  <rect x="180" y="330" width="150" height="10" fill="#5D4037" />
  
  <!-- Person Silhouette (Connected) -->
  <g fill="#111">
    <!-- Head -->
    <circle cx="130" cy="280" r="18" />
    <!-- Neck -->
    <rect x="124" y="295" width="12" height="10" />
    <!-- Shoulders/Torso -->
    <path d="M90 380 Q90 310 130 305 Q170 310 170 380 Z" />
    <!-- Arm -->
    <path d="M155 325 Q185 330 200 330" fill="none" stroke="#111" stroke-width="14" stroke-linecap="round" />
  </g>

  <!-- Drink -->
  <g>
    <path d="M200 300 L230 300 L225 330 L205 330 Z" fill="rgba(255, 255, 255, 0.5)" stroke="#FFF" stroke-width="1" />
    <rect x="205" y="305" width="20" height="20" fill="#FF4500" /> <!-- Juice -->
    <line x1="215" y1="290" x2="215" y2="305" stroke="#FFF" stroke-width="2" /> <!-- Straw -->
  </g>
</svg>